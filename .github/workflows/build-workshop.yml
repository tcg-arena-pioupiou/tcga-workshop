name: Build workshop

on:
  schedule:
    - cron: "0 4 * * *"      # tous les jours à 4h UTC
  workflow_dispatch:          # bouton "Run workflow" dans l'onglet Actions
  push:
    branches: [main]
    paths:                    # immédiat quand tu merges un jeu ou modifies tes overrides
      - "registry.json"
      - ".github/workshop/overrides.json"

permissions:
  contents: write

# Jamais deux builds en même temps
concurrency:
  group: build-workshop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build games.json
        run: node .github/workshop/scripts/build-workshop.js

      - name: Commit on main if something changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add .github/workshop/data/
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Workshop update $(date -u +%Y-%m-%d)"
            # Récupère un éventuel commit fait pendant le build avant de pousser
            git pull --rebase origin main
            git push origin HEAD:main
          fi
